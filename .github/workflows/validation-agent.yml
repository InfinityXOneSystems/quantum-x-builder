name: "Validation Agent"

on:
  workflow_call:
    inputs:
      pr_number:
        required: false
        type: string
    secrets:
      GITHUB_TOKEN:
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        id: install
        run: npm ci || npm install
        
      - name: Run Validation Suite
        id: validate
        run: node .github/agents/validator-agent.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          
      - name: Read Validation Report
        id: read_report
        if: always()
        run: |
          if [ -f .github/agents/validation-report.json ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            approved=$(cat .github/agents/validation-report.json | jq -r '.approved')
            needs_healing=$(cat .github/agents/validation-report.json | jq -r '.needsHealing')
            echo "approved=$approved" >> $GITHUB_OUTPUT
            echo "needs_healing=$needs_healing" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
            echo "::error::Validation report not found. Validator may have crashed."
            exit 1
          fi
          
      - name: Check Validation Result
        if: always() && steps.read_report.outputs.report_exists == 'true'
        run: |
          if [ "${{ steps.read_report.outputs.approved }}" != "true" ]; then
            echo "::warning::Validation failed. See report for details."
            exit 1
          fi
          
      - name: Post Validation Report
        if: steps.read_report.outputs.report_exists == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('.github/agents/validation-report.json', 'utf8'));
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: report.markdown
              });
              
              if (report.approved) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  event: 'APPROVE',
                  body: '✅ Validation Agent: All checks passed'
                });
              } else {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  event: 'REQUEST_CHANGES',
                  body: '❌ Validation Agent: Changes required'
                });
              }
            } catch (error) {
              console.error('Error posting validation report:', error);
            }
            
      - name: Trigger Healing Agent if Needed
        if: steps.read_report.outputs.needs_healing == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'healing-agent.yml',
              ref: context.payload.pull_request.head.ref,
              inputs: {
                pr_number: String(context.payload.pull_request.number)
              }
            });
